server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:30s}

gateway:
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  content-service-url: ${CONTENT_SERVICE_URL:http://localhost:8082}
  narration-service-url: ${NARRATION_SERVICE_URL:http://localhost:8083}
  service-token: ${GATEWAY_SERVICE_TOKEN:gateway-token}
  jwks-ttl: ${JWKS_TTL:10m}
  unknown-kid-ttl: ${JWKS_UNKNOWN_KID_TTL:30s}
  jwt-clock-skew: ${JWT_CLOCK_SKEW:30s}
  connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:3s}
  response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:30s}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Idempotency-Key
  routes:
    - id: content-languages-config
      method: GET
      path: /api/v1/languages/config
      target: CONTENT
      authentication: CONTENT_ADMIN
    - id: content-source-languages
      method: GET
      path: /api/v1/languages/source
      target: CONTENT
      authentication: CONTENT_ADMIN
    - id: content-pois-list
      method: GET
      path: /api/v1/pois
      target: CONTENT
      authentication: CONTENT_ADMIN
    - id: content-poi-create
      method: POST
      path: /api/v1/pois
      target: CONTENT
      authentication: CONTENT_ADMIN
    - id: content-poi-get
      method: GET
      path: /api/v1/pois/{poiId}
      target: CONTENT
      authentication: CONTENT_ADMIN
    - id: content-poi-update
      method: PUT
      path: /api/v1/pois/{poiId}
      target: CONTENT
      authentication: CONTENT_ADMIN
    - id: content-poi-delete
      method: DELETE
      path: /api/v1/pois/{poiId}
      target: CONTENT
      authentication: CONTENT_ADMIN
    - id: content-create
      method: POST
      path: /api/v1/pois/{poiId}/contents
      target: CONTENT
      authentication: CONTENT_ADMIN
    - id: content-active-by-poi
      method: GET
      path: /api/v1/pois/{poiId}/contents/active
      target: CONTENT
      authentication: CONTENT_ADMIN
    - id: content-list
      method: GET
      path: /api/v1/contents
      target: CONTENT
      authentication: CONTENT_ADMIN
    - id: content-get
      method: GET
      path: /api/v1/contents/{contentId}
      target: CONTENT
      authentication: CONTENT_ADMIN
    - id: content-update
      method: PUT
      path: /api/v1/contents/{contentId}
      target: CONTENT
      authentication: CONTENT_ADMIN
    - id: content-delete
      method: DELETE
      path: /api/v1/contents/{contentId}
      target: CONTENT
      authentication: CONTENT_ADMIN
    - id: auth-users-list
      method: GET
      path: /api/v1/auth/users
      target: AUTH
      authentication: SUPER_ADMIN
    - id: auth-users-create
      method: POST
      path: /api/v1/auth/users
      target: AUTH
      authentication: SUPER_ADMIN
    - id: auth-change-own-password
      method: PUT
      path: /api/v1/auth/password
      target: AUTH
      authentication: AUTHENTICATED
    - id: auth-user-reset-password
      method: PUT
      path: /api/v1/auth/users/{userId}/reset-password
      target: AUTH
      authentication: SUPER_ADMIN
    - id: auth-user-password
      method: PUT
      path: /api/v1/auth/users/{userId}/password
      target: AUTH
      authentication: AUTHENTICATED
    - id: auth-user-unlock
      method: PUT
      path: /api/v1/auth/users/{userId}/unlock
      target: AUTH
      authentication: SUPER_ADMIN
    - id: auth-user-disable
      method: PUT
      path: /api/v1/auth/users/{userId}/disable
      target: AUTH
      authentication: SUPER_ADMIN
    - id: auth-user-enable
      method: PUT
      path: /api/v1/auth/users/{userId}/enable
      target: AUTH
      authentication: SUPER_ADMIN
    - id: narration-voices
      method: GET
      path: /api/v1/voices
      target: NARRATION
      authentication: CONTENT_ADMIN
    - id: narration-job-create
      method: POST
      path: /api/v1/jobs
      target: NARRATION
      authentication: CONTENT_ADMIN
    - id: narration-job-list
      method: GET
      path: /api/v1/jobs
      target: NARRATION
      authentication: CONTENT_ADMIN
    - id: narration-job-get
      method: GET
      path: /api/v1/jobs/{jobId}
      target: NARRATION
      authentication: CONTENT_ADMIN
    - id: narration-job-cancel
      method: POST
      path: /api/v1/jobs/{jobId}/cancel
      target: NARRATION
      authentication: CONTENT_ADMIN
    - id: narration-batch-translate
      method: POST
      path: /api/v1/jobs/batch-translate
      target: NARRATION
      authentication: CONTENT_ADMIN
    - id: narration-batch-translate-get
      method: GET
      path: /api/v1/jobs/batch-translate/{batchId}
      target: NARRATION
      authentication: CONTENT_ADMIN
    - id: narration-batch-translate-cancel
      method: POST
      path: /api/v1/jobs/batch-translate/{batchId}/cancel
      target: NARRATION
      authentication: CONTENT_ADMIN
    - id: narration-job-events
      method: GET
      path: /api/v1/jobs/{jobId}/events
      target: LOCAL
      authentication: SSE_CONTENT_ADMIN
    - id: visitor-pois
      method: GET
      path: /api/v1/client/pois
      target: LOCAL
      authentication: PUBLIC
    - id: visitor-pois-nearby
      method: GET
      path: /api/v1/client/pois/nearby
      target: LOCAL
      authentication: PUBLIC
    - id: visitor-presence-heartbeat
      method: POST
      path: /api/v1/client/presence/heartbeat
      target: LOCAL
      authentication: PUBLIC
    - id: visitor-presence-count
      method: GET
      path: /api/v1/client/presence/count
      target: LOCAL
      authentication: PUBLIC
    - id: admin-presence-count
      method: GET
      path: /api/v1/presence/count
      target: LOCAL
      authentication: PUBLIC
    - id: visitor-qr
      method: GET
      path: /api/v1/client/qr/{qrCode}
      target: LOCAL
      authentication: PUBLIC
    - id: visitor-poi-narrations
      method: GET
      path: /api/v1/client/pois/{poiId}/narrations
      target: LOCAL
      authentication: PUBLIC
    - id: visitor-poi-narration
      method: GET
      path: /api/v1/client/pois/{poiId}/narrations/{lang}
      target: LOCAL
      authentication: PUBLIC
    - id: narration-progress-callback
      method: POST
      path: /internal/callbacks/job-progress
      target: LOCAL
      authentication: INTERNAL_NARRATION
    - id: auth-login
      method: POST
      path: /api/v1/auth/login
      target: AUTH
      authentication: PUBLIC
    - id: auth-refresh
      method: POST
      path: /api/v1/auth/refresh
      target: AUTH
      authentication: PUBLIC
    - id: auth-jwks
      method: GET
      path: /api/v1/auth/.well-known/jwks.json
      target: AUTH
      authentication: PUBLIC
    - id: auth-logout
      method: POST
      path: /api/v1/auth/logout
      target: AUTH
      authentication: AUTHENTICATED
    - id: health
      method: GET
      path: /health
      target: LOCAL
      authentication: PUBLIC

logging:
  level:
    root: INFO
    reactor.netty.http.client: OFF

