name: tts-service
on:
  push:
    paths: ['tts-service/**', '.github/workflows/tts-service.yml']
  pull_request:
    paths: ['tts-service/**', '.github/workflows/tts-service.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tts-service-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: mvn clean verify
        working-directory: tts-service
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -DskipTests package
        working-directory: tts-service
      - name: Smoke test jar liveness
        shell: bash
        working-directory: tts-service
        run: |
          java -jar target/tts-service-1.0.0-SNAPSHOT.jar > app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8085/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat app.log
          exit 1
      - name: Prepare release files
        shell: bash
        working-directory: tts-service
        run: |
          cp target/tts-service-1.0.0-SNAPSHOT.jar tts-service.jar
          sha256sum tts-service.jar > tts-service.jar.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: tts-service-v${{ github.run_number }}
          files: |
            tts-service/tts-service.jar
            tts-service/tts-service.jar.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

