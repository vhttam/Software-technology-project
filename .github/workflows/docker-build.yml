name: docker-build
on:
  push:
    paths:
      - '**/Dockerfile'
      - '**/nginx.conf'
      - 'docker-compose*.yml'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - '**/Dockerfile'
      - '**/nginx.conf'
      - 'docker-compose*.yml'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - content-service
          - narration-service
          - translation-service
          - tts-service
          - web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: cnpm-${{ matrix.service }}:test
