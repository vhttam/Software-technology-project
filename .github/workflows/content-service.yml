name: content-service
on:
  push:
    paths: ['content-service/**', '.github/workflows/content-service.yml']
  pull_request:
    paths: ['content-service/**', '.github/workflows/content-service.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: content-service-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x ./mvnw && ./mvnw clean verify
        working-directory: content-service
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x ./mvnw && ./mvnw -DskipTests package
        working-directory: content-service
      - name: Smoke test jar liveness
        shell: bash
        working-directory: content-service
        run: |
          java -jar target/content-service-1.0.0-SNAPSHOT.jar > app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8082/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat app.log
          exit 1
      - name: Prepare release files
        shell: bash
        working-directory: content-service
        run: |
          cp target/content-service-1.0.0-SNAPSHOT.jar content-service.jar
          sha256sum content-service.jar > content-service.jar.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: content-service-v${{ github.run_number }}
          files: |
            content-service/content-service.jar
            content-service/content-service.jar.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

