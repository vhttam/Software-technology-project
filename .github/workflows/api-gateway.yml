name: api-gateway

on:
  push:
    branches: ["**"]
    paths:
      - "api-gateway/**"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".github/workflows/api-gateway.yml"
  pull_request:
    branches: [main]
    paths:
      - "api-gateway/**"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".github/workflows/api-gateway.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Thao tác cho riêng service này"
        required: true
        type: choice
        options:
          - deploy
          - rollback
        default: deploy

permissions:
  contents: read

concurrency:
  group: api-gateway-staging
  cancel-in-progress: false

jobs:
  verify:
    name: Verify api-gateway
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test with Maven Wrapper
        run: bash ./mvnw -B -f api-gateway/pom.xml clean verify

      - name: Save deployable JAR
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-jar
          path: api-gateway/target/*.jar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy api-gateway to Staging
    needs: verify
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-gateway-jar
          path: artifact

      - name: Copy JAR over SSH, switch release, restart, and health-check
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?Missing staging environment secret STAGING_HOST}"
          : "${STAGING_USER:?Missing staging environment secret STAGING_USER}"
          : "${STAGING_SSH_KEY:?Missing staging environment secret STAGING_SSH_KEY}"
          : "${STAGING_KNOWN_HOSTS:?Missing staging environment secret STAGING_KNOWN_HOSTS}"

          jar_path="$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)"
          test -n "$jar_path"
          install -d -m 700 "$RUNNER_TEMP/ssh"
          key_file="$RUNNER_TEMP/ssh/staging_key"
          hosts_file="$RUNNER_TEMP/ssh/known_hosts"
          printf '%s\n' "$STAGING_SSH_KEY" > "$key_file"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$hosts_file"
          chmod 600 "$key_file" "$hosts_file"
          ssh_args=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts_file")
          destination="$STAGING_USER@$STAGING_HOST"
          remote_jar="/tmp/api-gateway-${{ github.sha }}.jar"
          scp "${ssh_args[@]}" "$jar_path" "$destination:$remote_jar"
          ssh "${ssh_args[@]}" "$destination" bash -s -- deploy "$RELEASE_ID" "$remote_jar" <<'REMOTE'
          set -Eeuo pipefail
          operation="$1"
          release_id="$2"
          uploaded_jar="$3"
          app_root="/opt/sgu/api-gateway"
          releases="$app_root/releases"
          current="$app_root/current"
          previous="$app_root/previous"
          unit="sgu-api-gateway.service"
          health_url="http://127.0.0.1:8080/health"

          atomic_link() {
            target="$1"
            link="$2"
            temporary="${link}.next.$$"
            ln -s -- "$target" "$temporary"
            mv -Tf -- "$temporary" "$link"
          }
          check_health() {
            for attempt in $(seq 1 30); do
              if curl --fail --silent --max-time 3 "$health_url" >/dev/null; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          install -d -m 0750 "$releases"
          old_target="$(readlink -f "$current" 2>/dev/null || true)"
          old_previous="$(readlink -f "$previous" 2>/dev/null || true)"
          if [[ "$operation" != deploy ]]; then
            echo "Unsupported operation: $operation" >&2
            exit 2
          fi
          test -s "$uploaded_jar"
          release="$releases/$release_id"
          install -d -m 0750 "$release"
          install -m 0640 "$uploaded_jar" "$release/app.jar"
          rm -f -- "$uploaded_jar"

          if [[ -n "$old_target" ]]; then
            atomic_link "$old_target" "$previous"
          fi
          atomic_link "$release" "$current"
          if ! sudo -n systemctl restart "$unit"; then
            if [[ -n "$old_target" ]]; then
              atomic_link "$old_target" "$current"
              if [[ -n "$old_previous" ]]; then
                atomic_link "$old_previous" "$previous"
              else
                rm -f -- "$previous"
              fi
              sudo -n systemctl restart "$unit" || true
            else
              rm -f -- "$current"
              sudo -n systemctl stop "$unit" || true
            fi
            exit 1
          fi
          if check_health; then
            echo "api-gateway deployed successfully; GET /health returned 200."
            exit 0
          fi
          if [[ -n "$old_target" ]]; then
            atomic_link "$old_target" "$current"
            if [[ -n "$old_previous" ]]; then
              atomic_link "$old_previous" "$previous"
            else
              rm -f -- "$previous"
            fi
            sudo -n systemctl restart "$unit" || true
          else
            rm -f -- "$current"
            sudo -n systemctl stop "$unit" || true
          fi
          echo "Health check failed; previous release restored where available." >&2
          exit 1
          REMOTE

  rollback:
    name: Roll back api-gateway in Staging
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Switch current and previous release over SSH
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?Missing staging environment secret STAGING_HOST}"
          : "${STAGING_USER:?Missing staging environment secret STAGING_USER}"
          : "${STAGING_SSH_KEY:?Missing staging environment secret STAGING_SSH_KEY}"
          : "${STAGING_KNOWN_HOSTS:?Missing staging environment secret STAGING_KNOWN_HOSTS}"
          install -d -m 700 "$RUNNER_TEMP/ssh"
          key_file="$RUNNER_TEMP/ssh/staging_key"
          hosts_file="$RUNNER_TEMP/ssh/known_hosts"
          printf '%s\n' "$STAGING_SSH_KEY" > "$key_file"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$hosts_file"
          chmod 600 "$key_file" "$hosts_file"
          ssh_args=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts_file")
          ssh "${ssh_args[@]}" "$STAGING_USER@$STAGING_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          app_root="/opt/sgu/api-gateway"
          current="$app_root/current"
          previous="$app_root/previous"
          unit="sgu-api-gateway.service"
          health_url="http://127.0.0.1:8080/health"
          current_target="$(readlink -f "$current" 2>/dev/null || true)"
          previous_target="$(readlink -f "$previous" 2>/dev/null || true)"
          test -n "$current_target" && test -n "$previous_target"
          atomic_link() {
            target="$1"
            link="$2"
            temporary="${link}.next.$$"
            ln -s -- "$target" "$temporary"
            mv -Tf -- "$temporary" "$link"
          }
          atomic_link "$previous_target" "$current"
          atomic_link "$current_target" "$previous"
          if ! sudo -n systemctl restart "$unit"; then
            atomic_link "$current_target" "$current"
            atomic_link "$previous_target" "$previous"
            sudo -n systemctl restart "$unit" || true
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 3 "$health_url" >/dev/null; then
              echo "Rollback succeeded; GET /health returned 200."
              exit 0
            fi
            sleep 2
          done
          atomic_link "$current_target" "$current"
          atomic_link "$previous_target" "$previous"
          sudo -n systemctl restart "$unit" || true
          echo "Rollback health check failed; restored the release that was active before rollback." >&2
          exit 1
          REMOTE
