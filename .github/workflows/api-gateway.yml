name: api-gateway
on:
  push:
    paths: ['api-gateway/**', '.github/workflows/api-gateway.yml']
  pull_request:
    paths: ['api-gateway/**', '.github/workflows/api-gateway.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-gateway-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x ./mvnw && ./mvnw clean verify
        working-directory: api-gateway
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x ./mvnw && ./mvnw -DskipTests package
        working-directory: api-gateway
      - name: Smoke test jar liveness
        shell: bash
        working-directory: api-gateway
        run: |
          java -jar target/api-gateway-1.0.0-SNAPSHOT.jar > app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat app.log
          exit 1
      - name: Prepare release files
        shell: bash
        working-directory: api-gateway
        run: |
          cp target/api-gateway-1.0.0-SNAPSHOT.jar api-gateway.jar
          sha256sum api-gateway.jar > api-gateway.jar.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: api-gateway-v${{ github.run_number }}
          files: |
            api-gateway/api-gateway.jar
            api-gateway/api-gateway.jar.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
