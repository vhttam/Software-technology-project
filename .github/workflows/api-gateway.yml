name: api-gateway

on:
  push:
    branches: ["**"]
    paths:
      - "api-gateway/**"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - "Dockerfile.api-gateway"
      - ".dockerignore"
      - ".github/workflows/api-gateway.yml"
  pull_request:
    branches: [main]
    paths:
      - "api-gateway/**"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - "Dockerfile.api-gateway"
      - ".dockerignore"
      - ".github/workflows/api-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: api-gateway-staging
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: bash ./mvnw -B -f api-gateway/pom.xml clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker image build
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api-gateway
          push: false
          tags: api-gateway:verify

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image tagged with commit SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api-gateway
          push: true
          tags: ghcr.io/${{ github.repository }}-api-gateway:${{ github.sha }}

      - name: Deploy image to Staging and run smoke test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}-api-gateway:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?Missing repository secret STAGING_HOST}"
          : "${STAGING_USER:?Missing repository secret STAGING_USER}"
          : "${STAGING_SSH_KEY:?Missing repository secret STAGING_SSH_KEY}"
          : "${STAGING_KNOWN_HOSTS:?Missing repository secret STAGING_KNOWN_HOSTS}"
          : "${GHCR_USERNAME:?Missing repository secret GHCR_USERNAME}"
          : "${GHCR_READ_TOKEN:?Missing repository secret GHCR_READ_TOKEN}"

          install -d -m 700 "$HOME/.ssh"
          key_file="$RUNNER_TEMP/staging_deploy_key"
          printf '%s\n' "$STAGING_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh_args=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          destination="$STAGING_USER@$STAGING_HOST"

          printf '%s' "$GHCR_READ_TOKEN" | ssh "${ssh_args[@]}" "$destination" \
            "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
          ssh "${ssh_args[@]}" "$destination" bash -s -- "$IMAGE" <<'REMOTE'
          set -euo pipefail
          image="$1"
          container=sgu-api-gateway
          env_file=/etc/sgu/api-gateway.env
          health_url=http://127.0.0.1:8080/health
          key_file=/opt/sgu/keys/jwt-public.pem
          test -r "$env_file"
          test -r "$key_file"
          docker pull "$image"

          previous_image=""
          if docker container inspect "$container" >/dev/null 2>&1; then
            previous_image="$(docker inspect --format='{{.Image}}' "$container")"
            docker stop --time 30 "$container"
            docker rm "$container"
          fi

          start_container() {
            docker run --detach --name "$container" --restart unless-stopped \
              --network host --env-file "$env_file" \
              --volume "$key_file:$key_file:ro" "$1"
          }
          rollback() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            if [[ -n "$previous_image" ]]; then
              start_container "$previous_image"
            fi
          }

          if ! start_container "$image"; then
            rollback
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 3 "$health_url" >/dev/null; then
              echo "API Gateway Staging smoke test passed."
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 "$container" 2>/dev/null || true
          rollback
          exit 1
          REMOTE
