services:
  init-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cnpm-init-sqlserver
    restart: "no"
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDevPassword123!}
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "Creating application databases if not existing..."
        for db in authdb contentdb narrationdb translationdb ttsdb; do
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD:-LocalDevPassword123!}" -C -Q "IF DB_ID(N'$$db') IS NULL CREATE DATABASE [$$db];"
        done
        echo "Databases initialized successfully."

  auth-service:
    environment:
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=authdb;encrypt=true;trustServerCertificate=true
      DB_DRIVER: com.microsoft.sqlserver.jdbc.SQLServerDriver
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDevPassword123!}
    depends_on:
      init-sqlserver:
        condition: service_completed_successfully

  content-service:
    environment:
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=contentdb;encrypt=true;trustServerCertificate=true
      DB_DRIVER: com.microsoft.sqlserver.jdbc.SQLServerDriver
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDevPassword123!}
    depends_on:
      init-sqlserver:
        condition: service_completed_successfully

  translation-service:
    environment:
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=translationdb;encrypt=true;trustServerCertificate=true
      DB_DRIVER: com.microsoft.sqlserver.jdbc.SQLServerDriver
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDevPassword123!}
    depends_on:
      init-sqlserver:
        condition: service_completed_successfully

  tts-service:
    environment:
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=ttsdb;encrypt=true;trustServerCertificate=true
      DB_DRIVER: com.microsoft.sqlserver.jdbc.SQLServerDriver
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDevPassword123!}
    depends_on:
      init-sqlserver:
        condition: service_completed_successfully

  narration-service:
    environment:
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=narrationdb;encrypt=true;trustServerCertificate=true
      DB_DRIVER: com.microsoft.sqlserver.jdbc.SQLServerDriver
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDevPassword123!}
    depends_on:
      init-sqlserver:
        condition: service_completed_successfully
