server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: narration-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=narration_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:A_Strong_Dev_Password_123!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin_dev_password}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  mocks:
    enabled: ${APP_MOCKS_ENABLED:false}
  downstream:
    content-base-url: ${CONTENT_SERVICE_URL:http://localhost:8083}
    translation-base-url: ${TRANSLATION_SERVICE_URL:http://localhost:8084}
    tts-base-url: ${TTS_SERVICE_URL:http://localhost:8085}
    api-gateway-url: ${API_GATEWAY_URL:http://localhost:8080}
    gateway-service-token: ${GATEWAY_SERVICE_TOKEN:local_gateway_token_change_me}
    service-token: ${NARRATION_SERVICE_TOKEN:local_narration_token_change_me}
  jobs:
    translation-timeout: ${TRANSLATION_TIMEOUT:PT15M}
    synthesis-timeout: ${SYNTHESIS_TIMEOUT:PT15M}
    cancellation-retention: ${CANCELLATION_RETENTION:PT48H}
    idempotency-cleanup-delay: ${IDEMPOTENCY_CLEANUP_DELAY:PT1H}
    dispatch-delay: ${DISPATCH_DELAY:PT2S}
    timeout-scan-delay: ${TIMEOUT_SCAN_DELAY:PT30S}

logging:
  level:
    vn.sgu.narration: INFO
