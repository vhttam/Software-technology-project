services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cnpm-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-cnpm}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest123}
    ports:
      - "${BIND_IP:-0.0.0.0}:5672:5672"
      - "${BIND_IP:-0.0.0.0}:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 384M

  sqlserver:
    profiles: ["full"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cnpm-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDevPassword123!}
    ports:
      - "${BIND_IP:-0.0.0.0}:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-LocalDevPassword123!}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1536M

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: cnpm-auth-service
    environment:
      PORT: 8081
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: ${AUTH_DB_URL:-jdbc:h2:file:/app/data/authdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
      DB_DRIVER: ${AUTH_DB_DRIVER:-org.h2.Driver}
      DB_USER: ${AUTH_DB_USER:-sa}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-}
      FLYWAY_ENABLED: "true"
      AMQP_ENABLED: "false"
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Local Administrator}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin12345!}
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:-auth-token}
      CONTENT_SERVICE_TOKEN: ${CONTENT_SERVICE_TOKEN:-content-token}
      NARRATION_SERVICE_TOKEN: ${NARRATION_SERVICE_TOKEN:-narration-token}
      TRANSLATION_SERVICE_TOKEN: ${TRANSLATION_SERVICE_TOKEN:-translation-token}
      TTS_SERVICE_TOKEN: ${TTS_SERVICE_TOKEN:-tts-token}
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-gateway-token}
    ports:
      - "${BIND_IP:-0.0.0.0}:8081:8081"
    volumes:
      - auth_data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M

  content-service:
    build:
      context: ./content-service
      dockerfile: Dockerfile
    container_name: cnpm-content-service
    environment:
      PORT: 8082
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: ${CONTENT_DB_URL:-jdbc:h2:file:/app/data/contentdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
      DB_DRIVER: ${CONTENT_DB_DRIVER:-org.h2.Driver}
      DB_USER: ${CONTENT_DB_USER:-sa}
      DB_PASSWORD: ${CONTENT_DB_PASSWORD:-}
      FLYWAY_ENABLED: "true"
      AMQP_ENABLED: "false"
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:-auth-token}
      CONTENT_SERVICE_TOKEN: ${CONTENT_SERVICE_TOKEN:-content-token}
      NARRATION_SERVICE_TOKEN: ${NARRATION_SERVICE_TOKEN:-narration-token}
      TRANSLATION_SERVICE_TOKEN: ${TRANSLATION_SERVICE_TOKEN:-translation-token}
      TTS_SERVICE_TOKEN: ${TTS_SERVICE_TOKEN:-tts-token}
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-gateway-token}
      DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - "${BIND_IP:-0.0.0.0}:8082:8082"
    volumes:
      - content_data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M

  translation-service:
    build:
      context: ./translation-service
      dockerfile: Dockerfile
    container_name: cnpm-translation-service
    environment:
      PORT: 8084
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: ${TRANSLATION_DB_URL:-jdbc:h2:file:/app/data/translationdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
      DB_DRIVER: ${TRANSLATION_DB_DRIVER:-org.h2.Driver}
      DB_USER: ${TRANSLATION_DB_USER:-sa}
      DB_PASSWORD: ${TRANSLATION_DB_PASSWORD:-}
      FLYWAY_ENABLED: "true"
      AMQP_ENABLED: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-cnpm}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-guest123}
      CONTENT_SERVICE_URL: http://content-service:8082
      CONTENT_SERVICE_TOKEN: ${CONTENT_SERVICE_TOKEN:-content-token}
      TRANSLATION_SERVICE_TOKEN: ${TRANSLATION_SERVICE_TOKEN:-translation-token}
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-gateway-token}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-real}
      PROVIDER_MODE: ${PROVIDER_MODE:-real}
    ports:
      - "${BIND_IP:-0.0.0.0}:8084:8084"
    volumes:
      - translation_data:/app/data
      - ./config/languages.json:/app/config/languages.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      content-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  tts-service:
    build:
      context: ./tts-service
      dockerfile: Dockerfile
    container_name: cnpm-tts-service
    environment:
      PORT: 8085
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: ${TTS_DB_URL:-jdbc:h2:file:/app/data/ttsdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
      DB_DRIVER: ${TTS_DB_DRIVER:-org.h2.Driver}
      DB_USER: ${TTS_DB_USER:-sa}
      DB_PASSWORD: ${TTS_DB_PASSWORD:-}
      FLYWAY_ENABLED: "true"
      AMQP_ENABLED: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-cnpm}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-guest123}
      TRANSLATION_SERVICE_URL: http://translation-service:8084
      TRANSLATION_SERVICE_TOKEN: ${TRANSLATION_SERVICE_TOKEN:-translation-token}
      TTS_SERVICE_TOKEN: ${TTS_SERVICE_TOKEN:-tts-token}
      NARRATION_SERVICE_TOKEN: ${NARRATION_SERVICE_TOKEN:-narration-token}
      STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:-storage-signing-secret-change-me-32-chars}
      OBJECT_STORAGE_PATH: /app/storage
      OBJECT_STORAGE_PUBLIC_URL: ${OBJECT_STORAGE_PUBLIC_URL:-http://localhost:8085}
      TTS_PROVIDER: ${TTS_PROVIDER:-real}
      PROVIDER_MODE: ${PROVIDER_MODE:-real}
    ports:
      - "${BIND_IP:-0.0.0.0}:8085:8085"
    volumes:
      - tts_data:/app/data
      - tts_storage:/app/storage
      - ./config/languages.json:/app/config/languages.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      translation-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  narration-service:
    build:
      context: ./narration-service
      dockerfile: Dockerfile
    container_name: cnpm-narration-service
    environment:
      PORT: 8083
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: ${NARRATION_DB_URL:-jdbc:h2:file:/app/data/narrationdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
      DB_DRIVER: ${NARRATION_DB_DRIVER:-org.h2.Driver}
      DB_USER: ${NARRATION_DB_USER:-sa}
      DB_PASSWORD: ${NARRATION_DB_PASSWORD:-}
      FLYWAY_ENABLED: "true"
      AMQP_ENABLED: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-cnpm}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-guest123}
      CONTENT_SERVICE_URL: http://content-service:8082
      TTS_SERVICE_URL: http://tts-service:8085
      TRANSLATION_SERVICE_URL: http://translation-service:8084
      API_GATEWAY_URL: http://api-gateway:8080
      CONTENT_SERVICE_TOKEN: ${CONTENT_SERVICE_TOKEN:-content-token}
      TTS_SERVICE_TOKEN: ${TTS_SERVICE_TOKEN:-tts-token}
      TRANSLATION_SERVICE_TOKEN: ${TRANSLATION_SERVICE_TOKEN:-translation-token}
      NARRATION_SERVICE_TOKEN: ${NARRATION_SERVICE_TOKEN:-narration-token}
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-gateway-token}
    ports:
      - "${BIND_IP:-0.0.0.0}:8083:8083"
    volumes:
      - narration_data:/app/data
      - ./config/languages.json:/app/config/languages.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      content-service:
        condition: service_healthy
      translation-service:
        condition: service_healthy
      tts-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: cnpm-api-gateway
    environment:
      PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
      AUTH_SERVICE_URL: http://auth-service:8081
      CONTENT_SERVICE_URL: http://content-service:8082
      NARRATION_SERVICE_URL: http://narration-service:8083
      TRANSLATION_SERVICE_URL: http://translation-service:8084
      TTS_SERVICE_URL: http://tts-service:8085
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-gateway-token}
    ports:
      - "${BIND_IP:-0.0.0.0}:8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      narration-service:
        condition: service_healthy
      translation-service:
        condition: service_healthy
      tts-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: cnpm-web
    ports:
      - "${BIND_IP:-0.0.0.0}:3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  rabbitmq_data:
  sqlserver_data:
  auth_data:
  content_data:
  narration_data:
  translation_data:
  tts_data:
  tts_storage:
